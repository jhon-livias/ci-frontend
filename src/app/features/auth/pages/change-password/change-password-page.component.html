<app-auth-layout>
  <section class="rounded-2xl border border-[#dfd6d6] bg-[#faf6f7] p-6 shadow-[0_8px_20px_rgb(94_82_84_/_8%)] sm:p-7" aria-labelledby="change-password-title">
    <header class="text-center">
      <h1 class="text-[1.35rem] font-black uppercase tracking-[-0.035em] text-[#92001f]" id="change-password-title">
        Cambia tu contraseña
      </h1>
      <p class="mx-auto mt-3 max-w-[18rem] text-base leading-snug text-[#1e1e1e]">
        Esta cuenta tiene una contraseña temporal. Define una propia para continuar.
      </p>
    </header>

    <form [formRoot]="passwordForm" (submit)="$event.preventDefault(); submit()" class="mt-7 space-y-4" aria-describedby="change-password-notice">
      <ui-field
        [formField]="passwordForm.password"
        [showPasswordToggle]="true"
        autocomplete="new-password"
        id="new-password"
        label="Nueva contraseña"
        placeholder="Mínimo 8 caracteres"
        type="password"
      />
      <ui-field
        [formField]="passwordForm.confirmation"
        [showPasswordToggle]="true"
        autocomplete="new-password"
        id="confirm-password"
        label="Confirmar contraseña"
        placeholder="Repite la contraseña"
        type="password"
      />
      <ui-button class="mt-2" [disabled]="isSubmitting()" [fullWidth]="true" [pill]="true" type="submit">
        {{ isSubmitting() ? 'Guardando…' : 'Guardar contraseña' }}
      </ui-button>
    </form>

    <p class="mt-5 min-h-5 text-center text-sm text-[#5e5254]" id="change-password-notice" aria-live="polite">
      {{ notice() }}
    </p>
  </section>
</app-auth-layout>
