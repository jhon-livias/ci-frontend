<app-auth-layout>
  <section class="rounded-2xl border border-[#dfd6d6] bg-[#faf6f7] p-6 shadow-[0_8px_20px_rgb(94_82_84_/_8%)] sm:p-7" aria-labelledby="forgot-password-title">
    <header class="text-center">
      <h1 class="text-[1.35rem] font-black uppercase tracking-[-0.035em] text-[#92001f]" id="forgot-password-title">
        Olvidé mi contraseña
      </h1>
      <p class="mx-auto mt-3 max-w-[18rem] text-base leading-snug text-[#1e1e1e]">
        Ingresa el correo con el que accedes al Centro de Idiomas.
      </p>
    </header>

    <form [formRoot]="recoveryForm" (submit)="submit()" class="mt-7" aria-describedby="recovery-notice">
      <ui-field
        [formField]="recoveryForm.email"
        autocomplete="email"
        id="recovery-email"
        label="Correo electrónico"
        placeholder="nombre@correo.com"
        type="email"
      />

      <p class="mt-3 text-xs leading-relaxed text-[#5e5254]">
        Te mostraremos el siguiente paso sin revelar si el correo está registrado.
      </p>

      <div class="mt-6 grid grid-cols-2 gap-3">
        <a
          class="grid h-[44px] place-items-center rounded-full border border-[#d5b8bf] bg-white px-4 text-sm font-semibold text-[#5e5254] transition hover:border-[#92001f] hover:text-[#92001f]"
          routerLink="/login"
        >
          Regresar
        </a>
        <ui-button [fullWidth]="true" [pill]="true" type="submit">Continuar</ui-button>
      </div>
    </form>

    <p class="mt-5 min-h-5 text-center text-sm text-[#5e5254]" id="recovery-notice" aria-live="polite">
      {{ notice() }}
    </p>
  </section>
</app-auth-layout>
