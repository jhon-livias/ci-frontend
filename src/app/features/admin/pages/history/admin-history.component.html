<ui-page-header [items]="crumbs" title="Historial" description="Registro de acciones de los usuarios" />
@if (message()) {
  <p class="mt-4 text-[#92001f]" role="alert">{{ message() }}</p>
}
<ui-filter-bar>
  <div class="w-full min-w-56 max-w-md flex-1">
    <ui-field id="history-search" label="Buscar historial" type="search" [value]="search()" (valueChange)="onSearch($event)" />
  </div>
  <div class="w-full min-w-44 max-w-xs flex-1">
    <ui-select id="history-role" label="Rol" [options]="roleOptions()" [searchable]="false" [value]="role()" (valueChange)="onRole($event)" />
  </div>
  <div class="w-full min-w-44 max-w-xs flex-1">
    <ui-select id="history-module" label="Módulo" [options]="moduleOptions()" [searchable]="false" [value]="module()" (valueChange)="onModule($event)" />
  </div>
</ui-filter-bar>

<div class="mt-6">
  <ui-table
    [columns]="columns"
    [rows]="tableRows()"
    [totalItems]="total()"
    [pageIndex]="page()"
    [selectedPageSize]="pageSize()"
    [sortState]="tableSort()"
    emptyMessage="No hay movimientos para mostrar."
    (sortChange)="onTableSort($event)"
    (pageChange)="onTablePage($event)"
  />
</div>
