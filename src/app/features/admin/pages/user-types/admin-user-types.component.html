<ui-page-header [items]="crumbs()" title="Tipos de usuario" (activate)="onCrumb($event)">
  @if (editorOpen()) {
    <ui-button type="button" (click)="closeEditor()">Volver</ui-button>
  } @else {
    <ui-button type="button" (click)="beginCreate()">Agregar</ui-button>
  }
</ui-page-header>
@if (message()) {
  <p class="mt-4 text-[#92001f]" role="alert">{{ message() }}</p>
}

@if (editorOpen()) {
  <div class="mt-6">
    <ui-field id="user-type-name" label="Nombre" [value]="editorName()" (valueChange)="onName($event)" />
  </div>

  <section class="mt-8 overflow-hidden rounded-2xl bg-white shadow-[0_8px_24px_rgb(30_30_30_/_8%)]" aria-label="Módulos con acceso">
    <h2 class="bg-[#e7cfd2] py-3 text-center text-base font-bold text-[#2b2425]">Módulos con acceso</h2>
    <ul>
      @for (permission of access(); track permission.id) {
        <li class="flex items-center gap-4 px-6 py-4">
          <button
            class="relative inline-flex h-6 w-11 shrink-0 items-center rounded-full transition-colors"
            [class.bg-[#d0123a]]="permission.enabled"
            [class.bg-[#bdbdbd]]="!permission.enabled"
            type="button"
            role="switch"
            [attr.aria-checked]="permission.enabled"
            [attr.aria-label]="permission.name"
            (click)="toggleAccess(permission.id)"
          >
            <span class="inline-block size-5 rounded-full bg-white shadow transition-transform" [class.translate-x-5]="permission.enabled" [class.translate-x-0.5]="!permission.enabled"></span>
          </button>
          <span>{{ permission.name }}</span>
        </li>
      }
    </ul>
  </section>
  <div class="mt-8 flex justify-end gap-4">
    <button class="rounded-full border border-[#c4002f] px-10 py-2.5 text-sm font-semibold text-[#c4002f]" type="button" (click)="closeEditor()">Volver</button>
    <button class="rounded-full bg-[#a9002d] px-10 py-2.5 text-sm font-semibold text-white disabled:opacity-60" type="button" [disabled]="saving()" (click)="saveEditor()">Guardar</button>
  </div>
} @else {
  <ui-filter-bar>
    <div class="w-full max-w-md">
      <ui-field id="user-type-search" label="Buscar tipo de usuario" type="search" [value]="search()" (valueChange)="onSearch($event)" />
    </div>
  </ui-filter-bar>

  <div class="mt-8">
    <ui-table
      [actions]="true"
      [columns]="columns"
      [rows]="tableRows()"
      [totalItems]="total()"
      [pageIndex]="page()"
      [selectedPageSize]="pageSize()"
      emptyMessage="No se encontraron tipos de usuario."
      (pageChange)="onTablePage($event)"
      (edit)="editFromTable($event)"
      (remove)="removeFromTable($event)"
      (toggle)="toggleFromTable($event)"
    />
  </div>
}
@if (confirmation(); as dialog) {
  <ui-confirm [message]="dialog.message" [details]="dialog.details" (confirmed)="acceptConfirmation()" (cancelled)="cancelConfirmation()" />
}
