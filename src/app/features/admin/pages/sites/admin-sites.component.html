<ui-page-header [items]="crumbs" title="Sedes">
  <ui-button (click)="startCreate()">Agregar sede</ui-button>
</ui-page-header>
@if (message()) {
  <p class="mt-4 text-[#92001f]" role="alert">{{ message() }}</p>
}
@if (loading()) {
  <p class="mt-8" role="status">Cargando sedes…</p>
} @else {
  <ui-filter-bar>
    <div class="w-full max-w-md">
      <ui-field id="site-search" label="Buscar sede" type="search" [(value)]="search" />
    </div>
  </ui-filter-bar>
  <div class="mt-6">
    <ui-table
      [columns]="columns"
      [rows]="rows()"
      [actions]="true"
      (edit)="startEdit($event)"
      (remove)="remove($event)"
      emptyMessage="No se encontraron sedes."
    />
  </div>
}
@if (confirmation(); as dialog) {
  <ui-confirm [message]="dialog.message" [details]="dialog.details" (confirmed)="acceptConfirmation()" (cancelled)="cancelConfirmation()" />
}
