<h1 class="font-[var(--font-heading)] text-[1.65rem] font-bold tracking-wide text-[#a9002d]">MÓDULOS</h1>
@if (message()) {
  <p class="mt-4 text-[#92001f]" role="alert">{{ message() }}</p>
}
<div class="relative mt-6 max-w-md">
  <label>
    <span class="sr-only">Buscar módulos</span>
    <input
      class="h-11 w-full rounded-md border border-[#d5d0d1] bg-white px-4 pr-14 text-sm text-[#1e1e1e] outline-none placeholder:text-[#b0b0b0] focus-visible:border-[#a9002d]"
      type="search"
      placeholder="Search"
      [value]="search()"
      (input)="onSearch($event)"
    />
  </label>
  <button
    class="absolute top-1/2 right-1.5 grid size-9 -translate-y-[62%] place-items-center rounded-full bg-[#7b3ff2] text-white shadow-sm"
    type="button"
    aria-label="Filtrar módulos con usuarios"
    [attr.aria-pressed]="occupied()"
    (click)="toggleOccupied()"
  >
    <svg aria-hidden="true" class="size-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path d="M4 5h16l-6 7v6l-4 2v-8z" stroke-linejoin="round" />
    </svg>
  </button>
</div>

<section class="mt-6 overflow-hidden rounded-2xl bg-white shadow-[0_8px_24px_rgb(30_30_30_/_8%)]" aria-label="Módulos">
  <div class="overflow-x-auto px-6 pt-4 sm:px-10">
    <table class="w-full min-w-[40rem] border-collapse text-center text-sm text-[#1e1e1e]">
      <thead>
        <tr class="border-b border-[#ece6e7] font-bold">
          <th class="h-12 px-3 font-bold" scope="col"><button class="inline-flex items-center gap-1" type="button" (click)="changeSort('name')">Nombre <svg aria-hidden="true" class="size-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="m8 9 4-4 4 4M8 15l4 4 4-4" stroke-linecap="round" stroke-linejoin="round" /></svg></button></th>
          <th class="h-12 px-3 font-bold" scope="col"><button class="inline-flex items-center gap-1" type="button" (click)="changeSort('users')">Usuarios <svg aria-hidden="true" class="size-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="m8 9 4-4 4 4M8 15l4 4 4-4" stroke-linecap="round" stroke-linejoin="round" /></svg></button></th>
          <th class="h-12 px-3 font-bold" scope="col"><button class="inline-flex items-center gap-1" type="button" (click)="changeSort('active')">Activos <svg aria-hidden="true" class="size-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="m8 9 4-4 4 4M8 15l4 4 4-4" stroke-linecap="round" stroke-linejoin="round" /></svg></button></th>
          <th class="h-12 px-3 font-bold" scope="col"><button class="inline-flex items-center gap-1" type="button" (click)="changeSort('inactive')">No Activos <svg aria-hidden="true" class="size-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="m8 9 4-4 4 4M8 15l4 4 4-4" stroke-linecap="round" stroke-linejoin="round" /></svg></button></th>
        </tr>
      </thead>
      <tbody>
        @for (row of visibleRows(); track row.id; let index = $index) {
          <tr class="border-b border-[#ece6e7]" [class.bg-[#f6f3f4]]="!row.placeholder && index % 2 === 1">
            <td class="h-14 px-3">{{ row.name }}</td>
            <td class="h-14 px-3">{{ row.placeholder ? '' : row.users }}</td>
            <td class="h-14 px-3">{{ row.placeholder ? '' : row.active }}</td>
            <td class="h-14 px-3">{{ row.placeholder ? '' : row.inactive }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
  <footer class="flex flex-wrap items-center justify-center gap-x-8 gap-y-3 px-6 py-8 text-sm text-[#2b2b2b]">
    <label class="flex items-center gap-3">
      <span>Items por pagina:</span>
      <span class="relative">
        <select class="h-10 appearance-none rounded-md border border-[#d0d0d0] bg-white pr-8 pl-3 text-sm" aria-label="Items por pagina" [value]="pageSize()" (change)="changePageSize($event)">
          @for (size of pageSizeOptions; track size) {
            <option [value]="size">{{ size }}</option>
          }
        </select>
        <svg aria-hidden="true" class="pointer-events-none absolute top-1/2 right-2 size-3.5 -translate-y-1/2 text-[#666]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path d="m6 9 6 6 6-6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </span>
    </label>
    <p class="m-0">{{ rangeLabel() }}</p>
    <div class="flex items-center gap-1" aria-label="Paginación">
      <button class="grid size-8 place-items-center text-2xl leading-none text-[#8a8a8a] disabled:opacity-40" type="button" aria-label="Página anterior" [disabled]="currentPage() === 0" (click)="changePage(currentPage() - 1)">‹</button>
      <button class="grid size-8 place-items-center text-2xl leading-none text-[#8a8a8a] disabled:opacity-40" type="button" aria-label="Página siguiente" [disabled]="currentPage() >= pageCount() - 1" (click)="changePage(currentPage() + 1)">›</button>
    </div>
  </footer>
</section>
