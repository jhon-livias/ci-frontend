<ui-page-header [items]="crumbs" title="Módulos" />
@if (message()) {
  <p class="mt-4 text-[#92001f]" role="alert">{{ message() }}</p>
}
<ui-filter-bar>
  <div class="w-full max-w-md">
    <ui-field id="module-search" label="Buscar módulo" type="search" [value]="search()" (valueChange)="onSearch($event)" />
  </div>
  <button
    class="h-12 rounded-md border border-[#d5d0d1] bg-white px-4 text-sm font-semibold text-[#1e1e1e]"
    type="button"
    aria-label="Filtrar módulos con usuarios"
    [attr.aria-pressed]="occupied()"
    (click)="toggleOccupied()"
  >
    {{ occupied() ? 'Con usuarios' : 'Todos' }}
  </button>
</ui-filter-bar>

<div class="mt-6">
  <ui-table
    [columns]="columns"
    [rows]="tableRows()"
    [totalItems]="total()"
    [pageIndex]="page()"
    [selectedPageSize]="pageSize()"
    [sortState]="tableSort()"
    emptyMessage="No se encontraron módulos."
    (sortChange)="onTableSort($event)"
    (pageChange)="onTablePage($event)"
  />
</div>
